# coturn configuration for BeamCode TURN relay fallback
listen-port=3478
tls-listen-port=5349
realm=share.example.com
use-auth-secret
static-auth-secret=replace_with_turn_secret_token
fingerprint
no-cli
no-tcp-relay
min-port=49160
max-port=49200
total-quota=100
user-quota=12
max-bps=20000000

# Security: Block relaying into private IP networks
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# TLS certificate paths (when TLS is enabled)
# cert=/etc/ssl/turn.crt
# pkey=/etc/ssl/turn.key
